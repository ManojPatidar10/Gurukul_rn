name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS (simulator)
        run: |
          # expo prebuild names the workspace and scheme after app.json's expo.name with spaces
          # removed ("Smart Gurukul" -> SmartGurukul). Discover it instead of hardcoding it, so
          # renaming the app can't break this build again (it did after d1c164f and #92).
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          if [ -z "$WORKSPACE" ]; then echo "No .xcworkspace found under ios/" >&2; exit 1; fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace $WORKSPACE, scheme $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build
          path: ios/build/
          if-no-files-found: error
