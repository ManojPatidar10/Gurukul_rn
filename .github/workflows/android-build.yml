name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # A healthy release build takes ~18 min; one hung in Gradle for 3 h on 2026-10-13 (default limit is 6 h).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      # Prebuild's gradle.properties caps the Gradle JVM at 2 GB heap / 512 MB metaspace. Since the
      # dependencies added on 2026-10-11 the release build outgrows that: the daemon logs
      # "OutOfMemoryError: Metaspace" and then hangs until the job times out. Give it more room
      # (the runner has 7 GB), and keep the Kotlin daemon from competing for the same memory.
      - name: Give Gradle more memory
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvmargs=/d' gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m'
          } >> gradle.properties
          grep -E '^(org.gradle|kotlin.daemon).jvmargs=' gradle.properties

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
